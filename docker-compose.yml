# Public deployment requires API_KEY and ADMIN_PASSWORD (the container refuses
# to start otherwise). Provide them in a sibling .env file.
# PROXY_PORT customizes the listen/mapped port (default 3457).
services:
  afree-proxy:
    build: .
    container_name: afree-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-3457}:${PROXY_PORT:-3457}"
    volumes:
      - ./data:/app/data
      # System-prompt override is off by default (APPLY_SYSTEM_PROMPT_OVERRIDE=false).
      # Uncomment and set APPLY_SYSTEM_PROMPT_OVERRIDE=true to enable:
      # - ./override.md:/app/override.md:ro
    environment:
      # Listen port inside the container (explicit -port flag wins over this)
      - PORT=${PROXY_PORT:-3457}
      # The single /v1 API key (Bearer / x-api-key); required for public deployment
      - API_KEY=${API_KEY:?set API_KEY in .env}
      # Admin panel login password; required for public deployment
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # OAuth account org id, sent as x-opencode-org-id (optional; only needed when
      # using an OAuth token as the key — raw API keys carry no org information)
      - ZEN_ORG_ID=${ZEN_ORG_ID:-}
      # Credential scheduling strategy, all platforms, default round_robin (fill / random)
      # WorkBuddy keeps its own vendor partition strategy; Trae has TRAE_STRATEGY below.
      - POOL_STRATEGY=${POOL_STRATEGY:-round_robin}
      # Trae-only scheduling override (round_robin / fill / random / credit-priority).
      # Empty = follow the panel "Selection strategy", then POOL_STRATEGY.
      - TRAE_STRATEGY=${TRAE_STRATEGY:-}
      # Request-log switch, default on (metadata only, 10MB cap auto-wipe)
      - LOG_REQUESTS=${LOG_REQUESTS:-true}
      - LOG_FILE_MAX_MB=${LOG_FILE_MAX_MB:-10}
      # Buffered-stream retry: total attempts (initial + retries) when the
      # upstream stream breaks mid-flight; default 2, set 1 to disable retrying
      - STREAM_ATTEMPT=${STREAM_ATTEMPT:-2}
      # Strict model matching: unknown model names return 400 instead of silently
      # falling back to the default model (set false to restore the old catch-all)
      - STRICT_MODEL_MATCH=${STRICT_MODEL_MATCH:-true}
      # Proxy isolation (identity ↔ exit binding): only true/false — true forces
      # it on (panel toggle read-only), false defaults it off (panel editable),
      # unset = panel toggle decides (default on). See README "Proxy isolation".
      - PROXY_ISOLATION=${PROXY_ISOLATION:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:${PROXY_PORT:-3457}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
