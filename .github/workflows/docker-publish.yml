name: Publish Docker image

# Triggers:
#   push to main            -> ghcr.io/<owner>/<repo>:latest (amd64 + arm64)
#   push to zen-harvest     -> ghcr.io/<owner>/<repo>:zencli (amd64 + arm64)
#   push of tag v0.9.0-harvest (or any v* matching the reflist) ->
#                             ghcr.io/<owner>/<repo>:26.10.10 (amd64 + arm64)
on:
  push:
    branches: [ main, zen-harvest ]
    tags: [ 'v0.9.0-harvest' ]
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # workspace 模式下 `./...` 只匹配主 module 的包（不穿透 modules/ 子目录
      # module，2026-11-17 实测 go list ./... 不含 modules/ 子 module（主仓包数随平台增长，2026-11-27 为 19）——vendor 两树必须显式
      # 按模块路径列出，漏了就是只测主 module 的假绿。
      - name: Build
        run: go build ./... github.com/misakano7545/workbuddy2api-panel/... trae2api/...

      - name: Vet
        run: go vet ./... github.com/misakano7545/workbuddy2api-panel/... trae2api/...

      # 端点闭合性对账（2026-11-19 handleWkbdShareOptimize 漏注册事故的固化
      # 护栏）：handler 消费面 / 前端 api() 调用 / wbCall→vendor 三方向对账，
      # 死端点与 404 静默降级在合并前暴露。判据与 SKIP 口径见脚本头注释。
      - name: Endpoint audit
        run: python3 scripts/endpoint_audit.py

      # -shuffle：测试套件曾经是顺序依赖的（包级 zenModels/
      # clineStreamLearned 被替换后不恢复），默认顺序永远绿、换序必红。
      # seed 必须写成 -shuffle=<n>：go 没有 -shuffle.seed 这个 flag，传了会让
      # test 二进制直接 "flag provided but not defined" 退出（2026-11-08 踩过）。
      # 固定 seed 让失败可复现。
      - name: Test (shuffled)
        run: go test ./... github.com/misakano7545/workbuddy2api-panel/... trae2api/... -count=1 -shuffle=1

      # -race：本仓库大量使用包级可变状态，而默认测试只覆盖串行路径。
      # Linux runner 有 cgo，可以跑；这是唯一能自动发现未加锁访问的关卡。
      - name: Test (race)
        run: go test ./... github.com/misakano7545/workbuddy2api-panel/... trae2api/... -count=1 -race

  docker:
    name: Docker image (amd64 + arm64)
    needs: vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=zencli,enable=${{ github.ref == 'refs/heads/zen-harvest' }}
            type=raw,value=26.10.10,enable=${{ github.ref == 'refs/tags/v0.9.0-harvest' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
